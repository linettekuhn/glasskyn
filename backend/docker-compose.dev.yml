name: glasskyn-dev

services:
  api:
    container_name: glasskyn-dev-api
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app
      - TZ=America/New_York
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./credentials:/app/credentials:ro
      - ./data/chromadb:/app/data/chromadb
    restart: unless-stopped

  db:
    container_name: glasskyn-dev-db
    image: postgres:16
    env_file:
      - .env.dev
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dev_postgres_data: